<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#f0f0f0"/>
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)"/>
  
  <!-- Ears -->
  <circle cx="45" cy="40" r="28" fill="#2c3e50"/>
  <circle cx="155" cy="40" r="28" fill="#2c3e50"/>
  <circle cx="45" cy="40" r="18" fill="#1a252f"/>
  <circle cx="155" cy="40" r="18" fill="#1a252f"/>
  
  <!-- Face -->
  <ellipse cx="100" cy="105" rx="65" ry="60" fill="url(#faceGrad)"/>
  
  <!-- Eye patches -->
  <ellipse cx="72" cy="90" rx="22" ry="20" fill="#2c3e50" transform="rotate(-10 72 90)"/>
  <ellipse cx="128" cy="90" rx="22" ry="20" fill="#2c3e50" transform="rotate(10 128 90)"/>
  
  <!-- Eyes -->
  <circle cx="72" cy="88" r="10" fill="#ffffff"/>
  <circle cx="128" cy="88" r="10" fill="#ffffff"/>
  <circle cx="74" cy="86" r="5" fill="#2c3e50"/>
  <circle cx="130" cy="86" r="5" fill="#2c3e50"/>
  <circle cx="76" cy="84" r="2" fill="#ffffff"/>
  <circle cx="132" cy="84" r="2" fill="#ffffff"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="108" rx="10" ry="7" fill="#2c3e50"/>
  <ellipse cx="100" cy="106" rx="4" ry="2" fill="#5a6c7a" opacity="0.5"/>
  
  <!-- Mouth -->
  <path d="M 92 115 Q 100 125 108 115" stroke="#2c3e50" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Cheeks -->
  <circle cx="60" cy="110" r="10" fill="#ff9a9e" opacity="0.3"/>
  <circle cx="140" cy="110" r="10" fill="#ff9a9e" opacity="0.3"/>
</svg>
